  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Wishes">

  <meta name="theme-color" content="#1a1220">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1220;
      --surface: #241930;
      --surface2: #2e2040;
      --accent: #e8b4c8;
      --accent2: #c9879e;
      --gold: #f0c97a;
      --gold2: #c9a24e;
      --text: #f0e8f0;
      --text-muted: #9080a0;
      --radius: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 100px;
    }

    /* HEADER */
    .app-header {
      padding: 32px 20px 0;
      text-align: center;
      margin-bottom: 24px;
    }
    .app-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .app-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* STATS ROW */
    .stats {
      display: flex;
      gap: 10px;
      padding: 0 16px;
      margin-bottom: 20px;
    }
    .stat {
      flex: 1;
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 1.6rem;
      font-weight: 800;
      display: block;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-num.pink { color: var(--accent); }
    .stat-num.gold { color: var(--gold); }
    .stat-label { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.04em; }

    /* CATEGORY FILTER */
    .cats {
      display: flex;
      gap: 6px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 99px;
      border: 1px solid rgba(232,180,200,0.2);
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: rgba(232,180,200,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* WISH LIST */
    .wishes { padding: 0 16px; }

    .wish-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(232,180,200,0.08);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, background 0.3s;
    }
    .wish-card.fulfilled {
      border-color: rgba(240,201,122,0.3);
      background: linear-gradient(135deg, rgba(240,201,122,0.06), rgba(232,180,200,0.04));
    }
    .wish-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      opacity: 0.4;
    }
    .wish-card.fulfilled::before {
      background: linear-gradient(180deg, var(--gold), var(--gold2));
      opacity: 1;
    }

    .wish-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .wish-emoji {
      font-size: 1.6rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .wish-info { flex: 1; min-width: 0; }
    .wish-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .wish-card.fulfilled .wish-name {
      color: var(--gold);
    }
    .wish-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wish-cat {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .wish-price {
      font-size: 0.72rem;
      color: var(--accent2);
      background: rgba(232,180,200,0.1);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .wish-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }
    .wish-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .wish-btn:hover { background: rgba(232,180,200,0.15); color: var(--accent); }
    .fulfill-btn {
      background: rgba(240,201,122,0.1);
      color: var(--gold);
      border: 1px solid rgba(240,201,122,0.2);
    }
    .fulfill-btn:hover { background: rgba(240,201,122,0.2); }

    .wish-note {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .wish-fulfilled-text {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--gold);
      line-height: 1.5;
      padding-top: 10px;
      border-top: 1px solid rgba(240,201,122,0.15);
      font-style: italic;
    }
    .fulfilled-badge {
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-text { font-size: 0.9rem; line-height: 1.6; }

    /* ADD BUTTON */
    .add-fab {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 99px;
      color: #1a1220;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 16px 32px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(232,180,200,0.25);
      transition: opacity 0.2s, transform 0.2s;
      letter-spacing: 0.02em;
      z-index: 50;
    }
    .add-fab:hover { opacity: 0.9; transform: translateX(-50%) scale(1.02); }

    /* MODAL */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,8,16,0.8);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-bg.open { display: flex; align-items: flex-end; }
    .modal {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
      text-align: center;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 6px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid rgba(232,180,200,0.1);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: rgba(232,180,200,0.4);
    }
    .field textarea { resize: none; min-height: 72px; }
    .field select option { background: #241930; }

    /* EMOJI ROW */
    .emoji-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .emoji-pick {
      font-size: 1.4rem;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--surface2);
      border: 2px solid transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    .emoji-pick.selected { border-color: var(--accent); }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-cancel {
      flex: 1;
      padding: 14px;
      background: var(--surface2);
      border: none;
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-save {
      flex: 2;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 14px;
      color: #1a1220;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* FULFILL MODAL */
    .fulfill-modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,8,16,0.85);
      z-index: 200;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .fulfill-modal-bg.open { display: flex; }
    .fulfill-modal {
      background: var(--surface);
      border-radius: 24px;
      width: calc(100% - 32px);
      max-width: 440px;
      padding: 28px 22px;
      text-align: center;
      border: 1px solid rgba(240,201,122,0.2);
    }
    .fulfill-star { font-size: 2.5rem; margin-bottom: 8px; }
    .fulfill-modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .fulfill-modal-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .fulfill-modal textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid rgba(240,201,122,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      resize: none;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      margin-bottom: 16px;
    }
    .btn-fulfill {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      border: none;
      border-radius: 14px;
      color: #1a1220;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-fulfill-cancel {
      width: 100%;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* CONFETTI */
    @keyframes confettifall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 999;
      animation: confettifall 2s ease-in forwards;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid rgba(232,180,200,0.2);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">✨ My Wish Journal</div>
  <div class="app-sub">your dreams, big and small</div>
</div>

<div class="stats">
  <div class="stat">
    <span class="stat-num pink" id="stat-total">0</span>
    <span class="stat-label">wishes</span>
  </div>
  <div class="stat">
    <span class="stat-num gold" id="stat-fulfilled">0</span>
    <span class="stat-label">came true ✨</span>
  </div>
  <div class="stat">
    <span class="stat-num pink" id="stat-pct">0%</span>
    <span class="stat-label">magic rate</span>
  </div>
</div>

<div class="cats" id="cat-filter"></div>

<div class="wishes" id="wishes-list"></div>

<button class="add-fab" onclick="openAdd()">+ Add a wish</button>

<!-- ADD MODAL -->
<div class="modal-bg" id="add-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title-text">New Wish ✨</div>

    <div class="field">
      <label>Choose an emoji</label>
      <div class="emoji-row" id="emoji-row"></div>
    </div>

    <div class="field">
      <label>What do you wish for?</label>
      <input type="text" id="wish-name" placeholder="e.g. that rose face cream..." maxlength="80">
    </div>

    <div class="field">
      <label>Category</label>
      <select id="wish-cat" onchange="updateEmojiRow(this.value)"></select>
    </div>

    <div class="field">
      <label>Price (optional)</label>
      <input type="text" id="wish-price" placeholder="e.g. $45" maxlength="20">
    </div>

    <div class="field">
      <label>Note (optional)</label>
      <textarea id="wish-note" placeholder="Where did you see it? A link, a store, a thought..."></textarea>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdd()">Cancel</button>
      <button class="btn-save" onclick="saveWish()">Save wish</button>
    </div>
  </div>
</div>

<!-- FULFILL MODAL -->
<div class="fulfill-modal-bg" id="fulfill-modal">
  <div class="fulfill-modal">
    <div class="fulfill-star">🌟</div>
    <div class="fulfill-modal-title">It came true!</div>
    <div class="fulfill-modal-sub">How did this wish come true? (optional)</div>
    <textarea id="fulfill-text" placeholder="e.g. Got it as a birthday gift from my sister 💕"></textarea>
    <button class="btn-fulfill" onclick="confirmFulfill()">Mark as fulfilled ✨</button>
    <button class="btn-fulfill-cancel" onclick="closeFulfill()">Not yet</button>
  </div>
</div>

<div class="modal-bg" id="addcat-modal">
  <div class="modal">
    <div class="modal-title">New Category ✨</div>
    <div class="field">
      <label>Emoji</label>
      <input type="text" id="new-cat-emoji" placeholder="✨" maxlength="2" style="width:80px">
    </div>
    <div class="field">
      <label>Category name</label>
      <input type="text" id="new-cat-name" placeholder="e.g. Home & Garden" maxlength="30">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddCat()">Cancel</button>
      <button class="btn-save" onclick="saveNewCat()">Add category</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_CATS = {
  beauty:     { label: '💄 Beauty',      emojis: ['💄','💅','🧴','🌸','✨','🪞','💆','🧖'] },
  things:     { label: '🛍️ Things',      emojis: ['👜','👠','💍','🕯️','🛋️','📱','⌚','🎀'] },
  travel:     { label: '✈️ Travel',      emojis: ['✈️','🏖️','🗺️','🏔️','🌍','🛳️','🏕️','🌅'] },
  experience: { label: '🍽️ Experience', emojis: ['🍽️','🎭','🎵','🍾','🎪','🌿','🎨','🧘'] },
  learn:      { label: '📚 Learning',    emojis: ['📚','🎓','🖥️','🎸','🌱','✍️','🧠','🎯'] },
  gifts:      { label: '🎁 Gift ideas',  emojis: ['🎁','🎀','💝','🛍️','💌','🌸','💄','✨'] },
  other:      { label: '✨ Other',        emojis: ['✨','🌙','💫','🦋','🌺','🍀','🎀','💜'] },
};

function getAllCats() {
  const custom = JSON.parse(localStorage.getItem('wj_cats') || '[]');
  const cats = { ...DEFAULT_CATS };
  custom.forEach(c => { cats[c.id] = { label: c.emoji + ' ' + c.name, emojis: [c.emoji,'✨','🌸','💫','🎯','🌟','💜','🎀'] }; });
  return cats;
}

function getCatEmojis(cat) { return getAllCats()[cat]?.emojis || DEFAULT_CATS.other.emojis; }
function getCatLabel(cat)  { return getAllCats()[cat]?.label || cat; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let wishes = [];
let currentFilter = 'all';
let editingId = null;
let fulfillId = null;
let selectedEmoji = '✨';

function load() {
  wishes = JSON.parse(localStorage.getItem('wj_wishes') || '[]');
}

function save() {
  localStorage.setItem('wj_wishes', JSON.stringify(wishes));
}

function render() {
  load();
  const filtered = currentFilter === 'all' ? wishes : wishes.filter(w => w.cat === currentFilter);
  const list = document.getElementById('wishes-list');

  const total = wishes.length;
  const fulfilled = wishes.filter(w => w.fulfilled).length;
  const pct = total ? Math.round(fulfilled / total * 100) : 0;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-fulfilled').textContent = fulfilled;
  document.getElementById('stat-pct').textContent = pct + '%';

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">${currentFilter === 'all' ? '🌸' : (getCatEmojis(currentFilter)?.[0] || '✨')}</div>
      <div class="empty-text">${currentFilter === 'all' ? 'Your wish journal is empty.<br>Add your first wish — big or small.' : 'No wishes in this category yet.'}</div>
    </div>`;
    return;
  }

  // sort: unfulfilled first, then fulfilled
  const sorted = [...filtered].sort((a, b) => {
    if (a.fulfilled === b.fulfilled) return b.id - a.id;
    return a.fulfilled ? 1 : -1;
  });

  list.innerHTML = sorted.map(w => `
    <div class="wish-card ${w.fulfilled ? 'fulfilled' : ''}">
      <div class="wish-top">
        <div class="wish-emoji">${w.emoji}</div>
        <div class="wish-info">
          <div class="wish-name">${esc(w.name)}</div>
          <div class="wish-meta">
            <span class="wish-cat">${getCatLabel(w.cat)}</span>
            ${w.price ? `<span class="wish-price">${esc(w.price)}</span>` : ''}
          </div>
          ${w.fulfilled ? `<div class="fulfilled-badge">✨ came true${w.fulfilledDate ? ' · ' + w.fulfilledDate : ''}</div>` : ''}
        </div>
        <div class="wish-actions">
          ${!w.fulfilled ? `<button class="wish-btn fulfill-btn" onclick="openFulfill('${w.id}')" title="Mark as fulfilled">✨</button>` : ''}
          <button class="wish-btn" onclick="openEdit('${w.id}')" title="Edit">✏️</button>
          <button class="wish-btn" onclick="deleteWish('${w.id}')" title="Delete">✕</button>
        </div>
      </div>
      ${w.note ? `<div class="wish-note">${esc(w.note)}</div>` : ''}
      ${w.fulfilled && w.fulfilledNote ? `<div class="wish-fulfilled-text">"${esc(w.fulfilledNote)}"</div>` : ''}
    </div>
  `).join('');
}

function openAddCat() {
  document.getElementById('new-cat-name').value = '';
  document.getElementById('new-cat-emoji').value = '✨';
  document.getElementById('addcat-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-cat-name').focus(), 100);
}

function closeAddCat() {
  document.getElementById('addcat-modal').classList.remove('open');
}

function saveNewCat() {
  const name = document.getElementById('new-cat-name').value.trim();
  const emoji = document.getElementById('new-cat-emoji').value.trim() || '✨';
  if (!name) { showToast('Add a category name 🌸'); return; }
  const custom = JSON.parse(localStorage.getItem('wj_cats') || '[]');
  const id = 'cat_' + Date.now();
  custom.push({ id, name, emoji });
  localStorage.setItem('wj_cats', JSON.stringify(custom));
  closeAddCat();
  renderCatFilter();
  showToast('Category added ✨');
}

function renderCatFilter() {
  const cats = getAllCats();
  const filter = document.getElementById('cat-filter');
  let html = `<button class="cat-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCat('all', this)">All</button>`;
  html += Object.entries(cats).map(([id, c]) =>
    `<button class="cat-btn ${currentFilter === id ? 'active' : ''}" onclick="filterCat('${id}', this)">${c.label}</button>`
  ).join('');
  html += `<button class="cat-btn" onclick="openAddCat()" style="border-style:dashed;opacity:0.7">+ Add</button>`;
  filter.innerHTML = html;
}

function renderCatSelect() {
  const cats = getAllCats();
  const sel = document.getElementById('wish-cat');
  const cur = sel.value;
  sel.innerHTML = Object.entries(cats).map(([id, c]) =>
    `<option value="${id}" ${id === cur ? 'selected' : ''}>${c.label}</option>`
  ).join('');
}

function filterCat(cat, btn) {
  currentFilter = cat;
  renderCatFilter();
  render();
}

// ADD / EDIT
function openAdd() {
  editingId = null;
  selectedEmoji = '✨';
  document.getElementById('wish-name').value = '';
  document.getElementById('wish-price').value = '';
  document.getElementById('wish-note').value = '';
  document.getElementById('modal-title-text').textContent = 'New Wish ✨';
  renderCatSelect();
  const defaultCat = currentFilter !== 'all' ? currentFilter : 'other';
  document.getElementById('wish-cat').value = defaultCat;
  updateEmojiRow(defaultCat);
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('wish-name').focus(), 100);
}

function openEdit(id) {
  load();
  const w = wishes.find(x => x.id == id);
  if (!w) return;
  editingId = id;
  selectedEmoji = w.emoji;
  document.getElementById('wish-name').value = w.name;
  document.getElementById('wish-price').value = w.price || '';
  document.getElementById('wish-note').value = w.note || '';
  document.getElementById('modal-title-text').textContent = 'Edit Wish';
  renderCatSelect();
  document.getElementById('wish-cat').value = w.cat;
  updateEmojiRow(w.cat, w.emoji);
  document.getElementById('add-modal').classList.add('open');
}

function closeAdd() {
  document.getElementById('add-modal').classList.remove('open');
  editingId = null;
}

function updateEmojiRow(cat, selected) {
  const emojis = getCatEmojis(cat);
  if (!selected) selected = emojis[0];
  selectedEmoji = selected;
  document.getElementById('emoji-row').innerHTML = emojis.map(e => `
    <div class="emoji-pick ${e === selected ? 'selected' : ''}" onclick="selectEmoji('${e}', this)">${e}</div>
  `).join('');
}

function selectEmoji(e, el) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-pick').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}

function saveWish() {
  const name = document.getElementById('wish-name').value.trim();
  if (!name) { showToast('Add a wish name 🌸'); return; }

  load();
  if (editingId) {
    const idx = wishes.findIndex(w => w.id == editingId);
    if (idx !== -1) {
      wishes[idx].name = name;
      wishes[idx].emoji = selectedEmoji;
      wishes[idx].cat = document.getElementById('wish-cat').value;
      wishes[idx].price = document.getElementById('wish-price').value.trim();
      wishes[idx].note = document.getElementById('wish-note').value.trim();
    }
  } else {
    wishes.push({
      id: Date.now(),
      name,
      emoji: selectedEmoji,
      cat: document.getElementById('wish-cat').value,
      price: document.getElementById('wish-price').value.trim(),
      note: document.getElementById('wish-note').value.trim(),
      fulfilled: false,
      fulfilledDate: null,
      fulfilledNote: null
    });
  }
  save();
  closeAdd();
  render();
  showToast(editingId ? 'Wish updated 🌸' : 'Wish added ✨');
}

function deleteWish(id) {
  load();
  wishes = wishes.filter(w => w.id != id);
  save();
  render();
}

// FULFILL
function openFulfill(id) {
  fulfillId = id;
  document.getElementById('fulfill-text').value = '';
  document.getElementById('fulfill-modal').classList.add('open');
  setTimeout(() => document.getElementById('fulfill-text').focus(), 100);
}

function closeFulfill() {
  document.getElementById('fulfill-modal').classList.remove('open');
  fulfillId = null;
}

function confirmFulfill() {
  if (!fulfillId) return;
  load();
  const idx = wishes.findIndex(w => w.id == fulfillId);
  if (idx !== -1) {
    wishes[idx].fulfilled = true;
    wishes[idx].fulfilledDate = new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    wishes[idx].fulfilledNote = document.getElementById('fulfill-text').value.trim();
  }
  save();
  closeFulfill();
  render();
  launchConfetti();
  showToast('Your wish came true! ✨');
}

function launchConfetti() {
  const colors = ['#e8b4c8','#f0c97a','#c9879e','#f5d6e8','#fff'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.animationDuration = (1.5 + Math.random()) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 40);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// close modals on bg click
document.getElementById('add-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('add-modal')) closeAdd();
});
document.getElementById('fulfill-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('fulfill-modal')) closeFulfill();
});
document.getElementById('addcat-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('addcat-modal')) closeAddCat();
});

// Enter key in inputs
document.getElementById('wish-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveWish(); });
document.getElementById('new-cat-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveNewCat(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAdd(); closeFulfill(); closeAddCat(); }
});

renderCatFilter();
render();
</script>
</body>
</html>
